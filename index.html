<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebGPU Test</title>
    <style>
        html, body { margin: 0; height: 100%; background: #0b0e13; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #hud {
            position: fixed; top: 12px; left: 12px;
            color: #9ab; font: 13px/1.5 ui-monospace, monospace;
            pointer-events: none; user-select: none;
        }
        #controls {
            position: fixed; top: 12px; right: 12px; z-index: 10;
            font: 13px/1.6 ui-monospace, monospace; color: #9ab;
            background: rgba(20, 26, 34, 0.85);
            padding: 10px 14px; border-radius: 6px;
            user-select: none;
        }
        #controls label { display: block; }
        #controls input[type=range] { width: 130px; vertical-align: middle; }
    </style>
</head>
<body>
    <canvas id="gpuCanvas"></canvas>
    <div id="controls">
        <label><input type="checkbox" id="gravityToggle" checked> Гравитация</label>
        <label><input type="checkbox" id="anchorToggle" checked> Выравнивающая сила</label>
        <label>Амплитуда   <input type="range" id="amp"     min="0" max="1.5" step="0.01" value="0.5"></label>
        <label>Частота  <input type="range" id="freq"    min="0.1" max="8" step="0.1" value="3.0"></label>
        <label>Жесткость<input type="range" id="spring" min="0" max="400" step="5" value="150"></label>
        <label>Демпфирование  <input type="range" id="damping" min="0.90" max="1.0" step="0.001" value="0.985"></label>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
